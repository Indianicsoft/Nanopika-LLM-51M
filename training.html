<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nanopika 51M · Training Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet" crossorigin />
    <style>
      :root {
        --bg-deep: #030712;
        --bg-card: rgba(15, 23, 42, 0.6);
        --accent-primary: #06b6d4;
        --accent-secondary: #10b981;
        --accent-tertiary: #8b5cf6;
        --text-main: #f1f5f9;
        --text-dim: #94a3b8;
        --border-glow: rgba(6, 182, 212, 0.3);
        --glass-bg: rgba(15, 23, 42, 0.8);
        --neon-cyan: 0 0 20px rgba(6, 182, 212, 0.5);
        --neon-green: 0 0 20px rgba(16, 185, 129, 0.4);
        --surface-1: #0f172a;
        --surface-2: #1e293b;
      }

      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--surface-2) transparent;
      }

      body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        background-image: 
          radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
          url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239C92AC' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2v-4h4v-2H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }

      .dashboard {
        width: 100%;
        max-width: 1100px;
        background: var(--glass-bg);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 50px;
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 25px 50px -12px rgba(0, 0, 0, 0.8);
        position: relative;
        overflow: hidden;
      }

      .dashboard::before {
        content: '';
        position: absolute;
        top: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-tertiary), transparent);
        opacity: 0.5;
      }

      h1 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin: 0 0 50px 0;
        font-size: 2.2rem;
        background: linear-gradient(135deg, #fff 0%, var(--accent-primary) 50%, var(--accent-tertiary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.3));
      }

      /* Stats Section */
      .stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: rgba(30, 41, 59, 0.3);
        padding: 20px 15px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        text-align: center;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        position: relative;
        overflow: hidden;
      }

      .stat-card::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--accent-primary);
        transform: scaleX(0);
        transition: transform 0.4s ease;
        transform-origin: right;
      }

      .stat-card:hover {
        background: rgba(30, 41, 59, 0.5);
        transform: translateY(-5px);
        border-color: rgba(6, 182, 212, 0.3);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      }

      .stat-card:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      .stat-card div:first-child {
        font-size: 0.65rem;
        color: var(--text-dim);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }

      .stat-val {
        font-family: 'Fira Code', monospace;
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--accent-primary);
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
      }

      /* Input Area */
      #train-format-badge {
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 6px 16px;
        border-radius: 30px;
        background: rgba(6, 182, 212, 0.1);
        display: inline-block;
        margin-bottom: 20px;
        border: 1px solid rgba(6, 182, 212, 0.2);
        color: var(--accent-primary);
        font-weight: 600;
      }

      textarea {
        width: 100%;
        height: 180px;
        background: rgba(2, 6, 23, 0.6);
        color: var(--accent-secondary);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 25px;
        margin-bottom: 30px;
        border-radius: 24px;
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        resize: none;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      textarea:focus {
        border-color: var(--accent-secondary);
        background: rgba(2, 6, 23, 0.8);
        box-shadow: 
          inset 0 2px 10px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(16, 185, 129, 0.15);
      }

      .input-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
      }

      .input-group label {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        display: block;
      }

      input[type="number"], input[type="range"] {
        width: 100%;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #fff;
        padding: 14px 20px;
        border-radius: 14px;
        font-family: 'Fira Code', monospace;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.3s ease;
      }

      input[type="number"]:focus {
        border-color: var(--accent-primary);
        background: rgba(30, 41, 59, 0.5);
      }

      /* Custom Range Input */
      input[type="range"] {
        -webkit-appearance: none;
        padding: 0;
        background: transparent;
        border: none;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        background: var(--surface-2);
        border-radius: 10px;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 18px;
        width: 18px;
        border-radius: 50%;
        background: var(--accent-primary);
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 10px var(--accent-primary);
      }

      /* Status & Progress */
      #train-status {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 15px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #train-status::before {
        content: '';
        width: 10px;
        height: 10px;
        background: var(--accent-secondary);
        border-radius: 50%;
        box-shadow: 0 0 15px var(--accent-secondary);
        animation: pulse-glow 2s infinite;
      }

      @keyframes pulse-glow {
        0% { opacity: 1; transform: scale(1); box-shadow: 0 0 5px var(--accent-secondary); }
        50% { opacity: 0.5; transform: scale(1.3); box-shadow: 0 0 20px var(--accent-secondary); }
        100% { opacity: 1; transform: scale(1); box-shadow: 0 0 5px var(--accent-secondary); }
      }

      progress {
        width: 100%;
        height: 10px;
        border-radius: 20px;
        background: rgba(30, 41, 59, 0.8);
        border: none;
        margin-bottom: 20px;
        appearance: none;
      }

      progress::-webkit-progress-bar {
        background: rgba(30, 41, 59, 0.8);
        border-radius: 20px;
      }

      progress::-webkit-progress-value {
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 20px;
        box-shadow: 0 0 15px var(--accent-primary);
      }

      .loss-display {
        text-align: right;
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-bottom: 40px;
        font-weight: 500;
        letter-spacing: 1px;
      }

      #train-loss {
        color: var(--accent-secondary);
        font-family: 'Fira Code', monospace;
        font-weight: 700;
        font-size: 1.1rem;
        margin-left: 10px;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-bottom: 50px;
      }

      button {
        background: linear-gradient(135deg, var(--accent-primary), #0891b2);
        color: #fff;
        border: none;
        padding: 22px 60px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 4px;
        border-radius: 100px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        box-shadow: 0 15px 35px -10px rgba(6, 182, 212, 0.5);
        text-transform: uppercase;
        min-width: 320px;
        white-space: nowrap;
      }

      button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.7s;
      }

      button:hover:not(:disabled) {
        transform: translateY(-5px);
        box-shadow: 0 25px 50px -15px rgba(6, 182, 212, 0.7);
        letter-spacing: 6px;
      }

      button:hover::before {
        left: 100%;
      }

      button:active {
        transform: translateY(-2px);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        background: #334155;
        box-shadow: none;
        transform: none;
      }

      /* Terminal */
      #terminal {
        background: #020617;
        color: #10b981;
        height: 400px;
        overflow-y: auto;
        padding: 30px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        line-height: 1.8;
        box-shadow: 
          inset 0 0 40px rgba(0, 0, 0, 0.8),
          0 10px 30px -15px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      #terminal::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.1) 50%
          ),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.03),
            rgba(0, 255, 0, 0.01),
            rgba(0, 0, 255, 0.03)
          );
        background-size: 100% 4px, 3px 100%;
        pointer-events: none;
        z-index: 2;
      }

      #terminal::-webkit-scrollbar {
        width: 6px;
      }

      #terminal::-webkit-scrollbar-track {
        background: transparent;
      }

      #terminal::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }

      #terminal::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Weight Management Section */
      .weight-management {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .weight-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .weight-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      #serializer-status {
        font-size: 0.7rem;
        color: var(--accent-secondary);
        font-family: 'Fira Code', monospace;
      }

      .weight-controls {
        display: flex;
        gap: 20px;
      }

      .secondary-btn {
        background: rgba(30, 41, 59, 0.4);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 25px;
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 1px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
        flex: 1;
        min-width: unset;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .secondary-btn:hover {
        background: rgba(30, 41, 59, 0.6);
        border-color: var(--accent-primary);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      .back-to-chat {
        position: absolute;
        top: 30px;
        left: 45px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        text-decoration: none;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        opacity: 0.8;
        z-index: 10;
      }
      .back-to-chat:hover {
        color: var(--accent-primary);
        opacity: 1;
        text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
      }
      .back-to-chat svg {
        transition: transform 0.3s ease;
      }
      .back-to-chat:hover svg {
        transform: translateX(-4px);
      }

      /* Mobile adjustments */
      @media (max-width: 768px) {
        .dashboard { padding: 40px 20px 30px 20px; }
        .stats { grid-template-columns: repeat(2, 1fr); }
        h1 { font-size: 1.6rem; }
        button { padding: 18px 40px; font-size: 0.9rem; }
        .back-to-chat {
          position: static;
          margin-bottom: 25px;
          display: inline-flex;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <a href="index.html" class="back-to-chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Chat
      </a>
      <h1>Nanopika 51M : Training Terminal</h1>

      <div class="stats">
        <div class="stat-card">
          <div>LOSS</div>
          <div id="lossVal" class="stat-val">0.0000</div>
        </div>
        <div class="stat-card">
          <div>STEP</div>
          <div id="stepVal" class="stat-val">0</div>
        </div>
        <div class="stat-card">
          <div>EPOCH</div>
          <div id="epochVal" class="stat-val">0</div>
        </div>
        <div class="stat-card">
          <div>LR</div>
          <div id="lrVal" class="stat-val">0.0000</div>
        </div>
        <div class="stat-card">
          <div>TOTAL STEPS</div>
          <div id="totalStepsVal" class="stat-val">0</div>
        </div>
      </div>

      <div id="train-format-badge">–</div>
      <textarea id="train-textarea" placeholder="Paste Neural Sequence or SFT Dialogue (user:/assistant:)...">
user: What is Artificial Intelligence?
assistant: Artificial Intelligence is the simulation of human intelligence processes by machines, especially computer systems.</textarea>

      <div class="input-grid">
        <div class="input-group">
          <label>Peak Learning Rate</label>
          <input type="number" id="peakLR" step="0.0001" value="0.0005" />
        </div>
        <div class="input-group">
          <label>Warmup Steps</label>
          <input type="number" id="warmupSteps" value="50" />
        </div>
        <div class="input-group">
          <label>Training Epochs</label>
          <input type="number" id="train-epochs" min="1" max="100" value="10" />
        </div>
        <div class="input-group">
          <label>Augmentation Prob (<span id="augVal">0.30</span>)</label>
          <input type="range" id="augProb" min="0" max="1" step="0.05" value="0.3" oninput="document.getElementById('augVal').innerText = parseFloat(this.value).toFixed(2)" />
        </div>
      </div>

      <div id="train-status">System Standby</div>
      <progress id="train-progress" value="0" max="100"></progress>
      <div class="loss-display">
        LIVE LOSS METRIC: <span id="train-loss">0.000000</span>
      </div>

      <div class="controls">
        <button id="train-btn">Initialize Training</button>
      </div>

      <div id="terminal">NEURAL_KERNEL_LOADED... READY_FOR_STREAM.</div>

      <!-- Weight Management Section -->
      <div class="weight-management">
        <div class="weight-header">
          <span class="weight-title">Weight Management</span>
          <div id="serializer-status">Status: Ready</div>
        </div>
        <div class="weight-controls">
          <button id="export-btn" class="secondary-btn">Export Weights & Vocab</button>
          <label for="import-input" class="secondary-btn">
            Import Weights (.bin)
            <input type="file" id="import-input" accept=".bin" style="display: none;">
          </label>
          <label for="import-vocab" class="secondary-btn">
            Import Vocab (.json)
            <input type="file" id="import-vocab" accept=".json" style="display: none;">
          </label>
        </div>
      </div>
    </div>

    <script type="module" src="./train_ui.js"></script>
  </body>
</html>
