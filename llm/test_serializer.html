<!DOCTYPE html>
<html>
<head><title>Binary Serialization Test</title></head>
<body>
    <h1>Binary Serialization Test</h1>
    <pre id="output"></pre>
    <script>
        const log = (msg) => {
            document.getElementById('output').textContent += msg + '\n';
            console.log(msg);
        };

        // Mock Step 2 Arena
        const weights = [
            new Float32Array([1.1, 2.2, 3.3]),
            new Float32Array([4.4, 5.5, 6.6, 7.7])
        ];

        // Mock fetch for loadWeights
        window.fetch = async (url) => {
            if (url === "mock.bin") {
                // Return a buffer matching the weights
                let total = 0;
                weights.forEach(w => total += w.byteLength);
                const buf = new ArrayBuffer(total);
                const view = new Uint8Array(buf);
                let off = 0;
                weights.forEach(w => {
                    view.set(new Uint8Array(w.buffer, w.byteOffset, w.byteLength), off);
                    off += w.byteLength;
                });
                return { arrayBuffer: () => Promise.resolve(buf) };
            }
        };

        // Override a.click to avoid actual download during test
        const originalClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function() {
            log("SUCCESS: exportWeights triggered download link click.");
        };
    </script>
    <script type="module">
        import { exportWeights, loadWeights, quantizeToF16, dequantizeToF32 } from "./serializer.js";

        async function runTests() {
            try {
                // 1. Test exportWeights
                log("Testing exportWeights...");
                exportWeights(weights, "test.bin");

                // 2. Test loadWeights
                log("Testing loadWeights...");
                const target = [
                    new Float32Array(3),
                    new Float32Array(4)
                ];
                await loadWeights("mock.bin", target);
                
                // Use Math.fround to compare with exact Float32 precision
                if (target[0][0] === Math.fround(1.1) && target[1][3] === Math.fround(7.7)) {
                    log("SUCCESS: loadWeights restored data correctly.");
                } else {
                    log("FAILURE: loadWeights mismatch. Got: " + target[0][0]);
                }

                // 3. Test Quantization (if supported)
                if (typeof Float16Array !== "undefined") {
                    log("Testing Float16 quantization...");
                    const f32 = new Float32Array([1.5, 2.5]);
                    const f16 = quantizeToF16(f32);
                    const out = new Float32Array(2);
                    dequantizeToF32(f16, out);
                    if (out[0] === 1.5 && out[1] === 2.5) {
                        log("SUCCESS: Float16 round-trip verified.");
                    } else {
                        log("FAILURE: Float16 mismatch.");
                    }
                } else {
                    log("Float16Array not supported, skipping quantization test.");
                }

            } catch (e) {
                log("ERROR: " + e.message);
                console.error(e);
            }
        }

        runTests();
    </script>
</body>
</html>
